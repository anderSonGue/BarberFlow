server.port=4000

# Conexión a Base de Datos MySQL (configurable mediante variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:barberflow}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Seguridad JWT
jwt.secret=${JWT_SECRET:barberflow_super_secure_jwt_secret_key_spring_boot_mysql_2026_enterprise}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.barberflow=INFO
